[project]
name = "instrument-reader"
version = "0.1.0"
description = "Kamerabasiertes Ablesen von Laborinstrumenten mit OCR und Live-Logging"
requires-python = ">=3.11"
dependencies = [
    "PySide6>=6.6",
    "opencv-python>=4.9",
    "numpy>=1.26",
    "pyqtgraph>=0.13",
]

[project.optional-dependencies]
# Tesseract direkt im Prozess (deutlich schneller). PyPI hat keine Windows-Wheels,
# dort z. B. "conda install -c conda-forge tesserocr" (siehe README).
fast = [
    "tesserocr>=2.7; sys_platform != 'win32'",
]
dev = [
    "pytest>=8.0",
    "pytest-qt>=4.4",
]

[project.scripts]
instrument-reader = "instrument_reader.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
