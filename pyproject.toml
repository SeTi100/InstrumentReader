[project]
name = "instrument-reader"
version = "0.1.0"
description = "Kamerabasiertes Ablesen von Laborinstrumenten mit OCR und Live-Logging"
requires-python = ">=3.11"
dependencies = [
    "PySide6>=6.6",
    "opencv-python>=4.9",
    "pytesseract>=0.3.10",
    "numpy>=1.26",
    "pyqtgraph>=0.13",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-qt>=4.4",
]

[project.scripts]
instrument-reader = "instrument_reader.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
